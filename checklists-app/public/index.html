<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#770287">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gonzo">
  <title>Gonzo · צ'ק ליסטים</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/shared/styles.css">
  <link rel="stylesheet" href="/app.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
</head>
<body>
  <!-- loading screen: shown until the app knows who is signed in -->
  <div id="splash" class="splash" role="status" aria-label="טוען">
    <img class="splash-art" id="splash-art" alt="">
    <div class="splash-shade"></div>
    <div class="splash-content">
      <img class="splash-logo" src="/shared/logo.png" alt="Dr. Gonzo">
      <div class="splash-title">צ'ק ליסטים</div>
      <div class="splash-spinner" aria-hidden="true"></div>
    </div>
  </div>
  <!-- random loading-screen picture: the list is generated from public/splash/ at build time -->
  <script src="/splash/list.js"></script>
  <script>
    (function () {
      var list = window.SPLASH_IMAGES || [];
      var art = document.getElementById('splash-art');
      if (!list.length) { art.remove(); return; }
      var last = null;
      try { last = localStorage.getItem('gonzo-splash-last'); } catch (e) { /* private mode */ }
      // pick at random, but not the same picture as last time (when there is a choice)
      var options = list.length > 1 ? list.filter(function (src) { return src !== last; }) : list;
      var pick = options[Math.floor(Math.random() * options.length)];
      try { localStorage.setItem('gonzo-splash-last', pick); } catch (e) { /* ignore */ }
      art.onerror = function () { art.remove(); };   // a missing file just leaves the dark background
      art.src = pick;
    })();
  </script>
  <div id="login" class="login hidden">
    <form id="login-form" class="card login-card">
      <img src="/shared/logo.png" alt="Dr. Gonzo" class="brand-logo" style="height:44px;margin:4px auto 0">
      <h1 style="text-align:center;font-size:20px;margin-top:2px">צ'ק ליסטים</h1>
      <label>שם מלא <input name="name" autocomplete="name" required minlength="2"></label>
      <label>מספר טלפון <input name="phone" type="tel" inputmode="tel" autocomplete="tel" required placeholder="05X-XXXXXXX"></label>
      <label id="code-field" class="hidden">קוד צוות <input name="code" autocomplete="off" placeholder="מקבלים מהאחמ״ש"></label>
      <label id="pin-field" class="hidden">קוד מנהל <input name="pin" type="password" autocomplete="current-password"></label>
      <button class="btn primary" type="submit" style="justify-content:center;padding:12px">כניסה</button>
      <p class="error" id="login-error"></p>
      <p class="muted" style="font-size:12px;margin:0">אותו שם ומספר משמשים גם לכניסה הבאה.</p>
    </form>
  </div>

  <div id="shell" class="app-shell hidden">
    <header class="app-top">
      <div class="brand"><img src="/shared/logo.png" alt="Dr. Gonzo" class="brand-logo" style="height:24px"><span class="brand-sub">צ'ק ליסטים</span></div>
      <div class="row" style="gap:8px;align-items:center">
        <span id="who" class="muted"></span>
        <button id="logout" class="btn small ghost">יציאה</button>
      </div>
    </header>
    <div id="range" class="range hidden">
      <button class="btn small" data-preset="today">היום</button>
      <button class="btn small" data-preset="week">7 ימים</button>
      <input type="date" id="from"> – <input type="date" id="to">
    </div>
    <h2 id="page-title" class="sr-only"></h2>
    <section id="view" class="view"></section>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
  <script src="/shared/checklists.js"></script>
</body>
</html>
